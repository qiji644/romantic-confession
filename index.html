      memories: [
        { number: "01", tag: "2025.12.07", title: "第一碗豆花", text: "Word 文档之后，一份很普通的感谢，被我记了很久。" },
        { number: "02", tag: "2026 · 惠州", title: "又一次豆花", text: "你回来的时候，真的又给我带了豆花。那天我很开心。" },
        { number: "03", tag: "广州 → 床边", title: "噜噜", text: "它陪我走了一年，后来终于到了你手上，还出现在你的照片里。" },

        { type: "p", text: "不知道这一大堆啰哩巴嗦的话有没有机会被你看到。也许账号同步到了，也许没有，也许插件出bug同步失败，也许不小心给你按到了保存本地数据而看不到。" },
        { type: "p", text: "看不到也没事，让它一直安静地躺在备忘录里吧，直到很久很久以后，也没有等到被打开的那一天。全部交给天意和缘分吧，一切都是命水。" },

        {

            { type: "p", text: "我一直记得2025年冬天的那个节气大雪，也就是12月7号。" },
            { type: "p", text: "那时候，因为我帮你处理了Word文档，你给我送了豆花。现在回想起来，那其实是一件很普通的小事。可能对你而言，只是一次简单的感谢，甚至早已不记得当时的情景。但我记得。" },
            { type: "p", text: "也许就是从那个时候开始，我对你有了不一样的感觉。" },
            { type: "p", text: "我说不清那一刻究竟是怎样的心情，只记得那份原本普通的善意，在我心里留下了很深的印象。后来再想起那个冬天，我总会不自觉地想起你。" },

        },
        {

            { type: "p", text: "到了2026年，我们又有了一些新的交集。" },
            { type: "p", text: "其实我以为我们会没什么交集了，虽然还是很想了解你，最后我觉得算了，还是不要打扰你生活，强行闯入别人的生活跟入室抢劫没区别...所以就不主动去找你了。" },

            { type: "p", text: "你把它挂在床边，还拍了照片发给我看。照片里有好多玩具总动员，你能把小时候的喜欢一直保留着，心里一直留着一块童真，还蛮打动我的。希望你一直可以保持下去。" },
            { type: "quote", text: "答应我不管结果怎么样，别把噜噜搞坏了，毕竟它陪我一年了哈哈哈" },

        },        {
          number: "03",
          kicker: "LITTLE THINGS",
          title: "细碎的瞬间",
          blocks: [
            { type: "p", text: "其实，我很喜欢这些细碎的瞬间。" },
            { type: "p", text: "它们没有什么轰轰烈烈的情节，也算不上多么特别的故事，可就是这些平常的小事，让我一点一点地了解你，也让我越来越在意你。" },
            { type: "p", text: "后来，我们聊游戏，聊学校里的事情，分享一些有趣的东西，偶尔开开玩笑。可恶，斗地主居然玩那么强....羽毛球也打得不错，很喜欢和你玩。" },
            { type: "p", text: "有时候，一段聊天并没有什么特别的内容，可只要是和你聊，我就会觉得很开心。" },
            { type: "quote", text: "可能喜欢一个人就是这样吧" },
            { type: "p", text: "最初只是因为一个瞬间而心动，后来却开始在意你说过的话、做过的事，甚至是那些不经意流露出来的小习惯。其它习惯我不清楚，但你有一个好习惯就是别人帮你，你会回馈给对方，不会觉得理所应当，这是个好习惯也是好品质。" },
            { type: "p", text: "慢慢地，喜欢不再只是最初的那份心动，而是变成了许多细小的、说不清楚的牵挂。" }
          ]
        },
        {
          number: "04",
          kicker: "SOME WORDS ABOUT ME",

            { type: "p", text: "可能你也发现了，我在线上比线下更能说一些。我是个i人，能说话已经是奇迹了，真正见到你的时候，我反而有些拘谨。" },
            { type: "p", text: "其实不是不想和你说话，只是因为在意，有时候反而不知道该怎么自然地表达。因为说多错得多，然后直接就不说哈哈哈。" },
            { type: "p", text: "有些话在手机上能够轻松打出来，到了你面前，却又不知道该从哪里开始。" },
            { type: "p", text: "所以，如果有时候我显得话很少，希望你不要误会。" },

          ]

        {
          number: "05",
          kicker: "THE TRUEST WORDS",

          blocks: [
            { type: "p", text: "说了这么多，其实最想告诉你的，还是那句话。" },
            { type: "declaration", text: "我喜欢你" },
            { type: "p", text: "这句话并不复杂，可我在心里想过很多次。不是一时冲动，是深思熟虑的决定。" },
            { type: "p", text: "我不知道你有没有察觉到，也不知道在你眼里，我究竟是一个怎样的人。可能追你的人太多了，已经把我淹没掉咯，这个很正常，因为你性格好人品好肯定会有很多人喜欢的，I know。所以难免会有很多男生找你聊天。" },
            { type: "p", text: "但我觉得你表面看起来很随和也很好相处，但真正能走进你心里的应该没有几个吧。" },
            { type: "p", text: "我更不知道，如果你真的读到了这里，会是什么样的心情。" },

            { type: "p", text: "但无论如何，我还是想认真地告诉你。" },
            { type: "p", text: "从2025年那个冬天开始，你就在我的记忆里留下了一个特别的位置。而到了2026年，这份最初的心动，也在一次次相处中慢慢变得更加清晰。" }
          ]
        },        {
          number: "06",
          kicker: "A GENTLE WISH",

          blocks: [
            { type: "p", text: "我并不是想用这封信要求你给我一个答案，也不希望它成为你的负担。" },
            { type: "p", text: "只是如果可以，我希望我们能够有机会更进一步。" },
            { type: "p", text: "找一个不那么匆忙的日子，一起出去走走，吃点东西，或者玩玩游戏。像平常聊天那样，慢慢了解彼此。" },

            { type: "p", text: "如果你对我的感觉和我不一样，我也会尊重你的选择。感情本来就不能勉强，我喜欢你是我的心意，而你有权利拥有自己的答案。因为人就一次生命，我喜欢的人，其实也想和喜欢的人在一起。" }
          ]
        },
        {
          number: "07",
          kicker: "WHATEVER THE ANSWER",
          title: "关于答案",
          blocks: [
            { type: "p", text: "我也想过很多种可能。" },
            { type: "p", text: "可能你会看到这封信，然后我们之间多了一段新的故事，也可能你永远不会看到它，我们依旧按照原来的轨迹生活。" },

            { type: "p", text: "明明有些话很想亲口告诉你，明明有些瞬间很想和你分享，可最后却选择把它们写进一封不确定能不能送达的信里。" },
            { type: "p", text: "但我想，这或许也是我目前能想到的一种表达方式。" },

            { type: "p", text: "至于你能不能看到，就交给时间吧。" },
            { type: "p", text: "如果有一天你真的读到了，那就当作是一次迟来的坦白。" },
            { type: "p", text: "如果没有，也没关系。至少，我曾经认真地喜欢过一个人，也曾经鼓起勇气，把这份喜欢写了下来。" }
          ]
        },
        {
          number: "08",
          kicker: "BEFORE THE SNOW",
          title: "把心意留给大雪",
          blocks: [
            { type: "p", text: "我一直觉得，大雪是一个很特别的日子。" },
            { type: "p", text: "2025年的大雪前后，因为一份豆腐，我开始记住了你。" },
            { type: "p", text: "2026年的大雪，我想把这一年多以来的心意，留在这封信里。" },
            { type: "p", text: "或许有些相遇本来就没有预设好的结局，有些心意也未必都能得到回应。" },
            { type: "p", text: "但我还是很庆幸，能在自己的青春里遇见你。" },
            { type: "p", text: "谢谢你曾经给过我的那些温暖。" },
            { type: "p", text: "如果未来我们还有机会走近一点，我会很珍惜。" },
            { type: "p", text: "如果没有，我也希望你以后一直开心，遇见喜欢的事，成为自己想成为的人。" },
            { type: "p", text: "最后，我想把这句话留在这里：" },
            { type: "poem", text: "去年大雪前后，一份豆腐让我记住了你。\n后来的一年里，那些平凡的日常让我越来越喜欢你。\n今年大雪，我终于把这份心意写了下来。\n至于这封信会不会被你看到，我不知道。\n但我想，如果命运愿意让你读到它，那就让你知道，曾经有一个人，因为一些很小的事情，认真地喜欢了你很久。" },
            { type: "p", text: "愿你一切都好，身体健康，好好生活，天天开心😊" },
            { type: "p", text: "我也要好好提升自己，沉下心把喜欢的事做好，慢慢变得稳定、从容，不用急着追赶谁，只和过去的自己比。" },
            { type: "p", text: "感谢你出现在我的这段时光里。" },
            { type: "postscript", text: "牛逼，我高考作文都没写那么多，这波性感了，斗地主打不过你，这种文采还是可以和你PK一波的。" },
            { type: "postscript", text: "你要是真看到了，能不能给我微信扣波1，感觉好神奇，这难道不是天时地利人和（扣1送地狱火）" }
          ]
        }

    .brand-mark {

      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);

      display: block;

      gap: 2px;
      width: 20px;
      height: 18px;

          <path d="M16 27S4.5 20.2 4.5 11.8A6.2 6.2 0 0 1 16 8.2a6.2 6.2 0 0 1 11.5 3.6C27.5 20.2 16 27 16 27Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="reject-star" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M16 3.5c.62 8.1 4.4 11.88 12.5 12.5-8.1.62-11.88 4.4-12.5 12.5C15.38 20.4 11.6 16.62 3.5 16 11.6 15.38 15.38 11.6 16 3.5Z" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="2.2" fill="currentColor" stroke="none" opacity=".55"/>
        </svg>
      </div>
      <p class="response-kicker" id="responseKicker">A LITTLE ANSWER</p>
      <h2 class="response-title" id="responseTitle"></h2>
      <p class="response-message" id="responseMessage"></p>
      <button class="response-close" id="responseClose" type="button"></button>
    </section>
  </div>

  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>
  <div class="music-toast" id="musicToast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      "use strict";

      const config = window.LOVE_CONFIG;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const random = (min, max) => min + Math.random() * (max - min);

      const setText = (id, text) => {
        const element = document.getElementById(id);
        if (element) element.textContent = text;
      };

      document.title = config.title.replace(/\n/g, " ");
      setText("coverEyebrow", config.coverEyebrow);
      setText("coverTitle", config.title);
      setText("coverSubtitle", config.coverSubtitle);
      setText("coverDate", config.coverDate);
      setText("coverCta", config.coverCta);
      setText("scrollHint", config.scrollHint);
      setText("memoryKicker", config.memoryKicker);
      setText("memoryTitle", config.memoryTitle);
      setText("memoryIntro", config.memoryIntro);
      setText("signatureName", config.signature);
      setText("signatureDate", config.signatureDate);
      setText("decisionQuestion", config.decisionQuestion);
      setText("acceptLabel", config.acceptLabel);
      setText("rejectLabel", config.rejectLabel);
      setText("footerNote", config.note);
      setText("entryKicker", config.entryKicker);
      setText("entryTitle", config.entryTitle);
      setText("entryMessage", config.entryMessage);
      setText("entryStartLabel", config.entryStart);
      setText("entrySkip", config.entrySkip);

      const introSnow = document.getElementById("introSnow");
      if (introSnow && !reducedMotion) {
        const snowFragment = document.createDocumentFragment();
        const snowCount = window.innerWidth < 600 ? 42 : 68;
        for (let index = 0; index < snowCount; index += 1) {
          const flake = document.createElement("i");
          flake.style.setProperty("--snow-left", `${random(1, 99).toFixed(2)}%`);
          flake.style.setProperty("--snow-size", `${random(1.2, 4.6).toFixed(2)}px`);
          flake.style.setProperty("--snow-opacity", random(0.32, 0.9).toFixed(2));
          flake.style.setProperty("--snow-duration", `${random(7, 15).toFixed(2)}s`);
          flake.style.setProperty("--snow-delay", `${random(-15, 0).toFixed(2)}s`);
          flake.style.setProperty("--snow-drift", `${random(-60, 60).toFixed(1)}px`);
          snowFragment.appendChild(flake);
        }
        introSnow.appendChild(snowFragment);
      }

      function createParagraph(text) {
        const p = document.createElement("p");
        p.textContent = text;
        return p;
      }

      function renderBlock(block, container) {
        let element;

        switch (block.type) {
          case "p":
            element = createParagraph(block.text);
            break;
          case "salutation":
            element = createParagraph(block.text);
            element.className = "salutation";
            break;
          case "quote":
            element = document.createElement("blockquote");
            element.className = "letter-quote";
            element.textContent = block.text;
            break;
          case "declaration":
            element = document.createElement("div");
            element.className = "letter-declaration";
            element.textContent = block.text;
            break;
          case "note":
            element = document.createElement("div");
            element.className = "letter-note";
            element.textContent = block.text;
            break;
          case "poem":
            element = document.createElement("div");
            element.className = "letter-poem";
            element.textContent = block.text;
            break;
          case "postscript":
            element = document.createElement("p");
            element.className = "letter-postscript";
            element.textContent = block.text;
            break;
          case "lulu": {
            element = document.createElement("figure");
            element.className = "lulu-figure";

            const luluImage = document.createElement("img");
            luluImage.src = config.luluImage || "./lulu.svg";
            luluImage.alt = config.luluAlt || block.text;
            luluImage.loading = "lazy";
            luluImage.decoding = "async";
            element.append(luluImage);

            /* 招手动画：平时保持待机帧，每隔一段时间切换精灵图 5 帧播放一次“招手”。 */
            const waveFrames = (config.luluWaveFrames && config.luluWaveFrames.length) ? config.luluWaveFrames : [];
            const idleMs = Number(config.luluWaveIdleMs) || 4200;
            const frameMs = Number(config.luluWaveFrameMs) || 110;

            if (waveFrames.length) {
              /* 预加载招手帧，避免第一次挥手时出现闪白 */
              waveFrames.forEach(src => {
                const pre = new Image();
                pre.decoding = "async";
                pre.src = src;
              });

              let waving = false;
              const playWave = () => {
                if (waving || document.hidden) return;
                waving = true;
                let i = 0;
                luluImage.src = waveFrames[0];
                const step = () => {
                  i += 1;
                  if (i < waveFrames.length) {
                    luluImage.src = waveFrames[i];
                    setTimeout(step, frameMs);
                  } else {
                    luluImage.src = config.luluImage || "./lulu.svg";
                    waving = false;
                  }
                };
                setTimeout(step, frameMs);
              };

              /* 第一次稍等片刻就挥手打个招呼，之后按固定节奏重复 */
              setTimeout(playWave, 900);
              setInterval(playWave, idleMs);
            }
            break;
          }
          default:
            element = createParagraph(block.text || "");
        }

        container.appendChild(element);
      }

      const openingElement = document.getElementById("letterOpening");
      if (openingElement) {
        let firstParagraph = true;
        config.opening.forEach((block) => {
          if (block.type === "salutation") {
            const salutation = createParagraph(block.text);
            salutation.className = "salutation";
            openingElement.appendChild(salutation);
            return;
          }

          if (firstParagraph) {
            const copy = document.createElement("div");
            copy.className = "letter-copy";
            copy.id = "openingCopy";
            openingElement.appendChild(copy);
            firstParagraph = false;
          }

          const copy = openingElement.querySelector(".letter-copy");
          renderBlock(block, copy);
        });
      }

      const memoryGrid = document.getElementById("memoryGrid");
      if (memoryGrid) {
        config.memories.forEach((memory) => {
          const card = document.createElement("article");
          card.className = "memory-card";

          const number = document.createElement("span");
          number.className = "memory-card-number";
          number.textContent = memory.number;
          number.setAttribute("aria-hidden", "true");

          const tag = document.createElement("p");
          tag.className = "memory-card-tag";
          tag.textContent = memory.tag;

          const title = document.createElement("h3");
          title.className = "memory-card-title";
          title.textContent = memory.title;

          const text = document.createElement("p");
          text.className = "memory-card-text";
          text.textContent = memory.text;

          card.append(number, tag, title, text);
          memoryGrid.appendChild(card);
        });
      }

      const coverOpen = document.getElementById("coverOpen");
      const letterStage = document.querySelector(".letter-stage");
      if (coverOpen && letterStage) {
        coverOpen.addEventListener("click", () => {
          letterStage.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "start" });
        });
      }
      const sectionsElement = document.getElementById("letterSections");
      if (sectionsElement) {
        config.sections.forEach((section) => {
          const sectionElement = document.createElement("section");
          sectionElement.className = "letter-section reveal";
          sectionElement.setAttribute("aria-labelledby", `section-title-${section.number}`);

          const side = document.createElement("div");
          side.className = "section-side";

          const number = document.createElement("span");
          number.className = "section-number";
          number.textContent = section.number;
          number.setAttribute("aria-hidden", "true");

          const kicker = document.createElement("p");
          kicker.className = "section-kicker";
          kicker.textContent = section.kicker;

          const title = document.createElement("h2");
          title.className = "section-title";
          title.id = `section-title-${section.number}`;
          title.textContent = section.title;

          side.append(number, kicker, title);

          const content = document.createElement("div");
          content.className = "section-content letter-copy";
          section.blocks.forEach((block) => renderBlock(block, content));

          sectionElement.append(side, content);
          sectionsElement.appendChild(sectionElement);
        });
      }
      /* ------------------------------
         背景：爱心 + 迪士尼小星星粒子
         可在顶部配置区通过 particlesEnabled 开关
      ------------------------------ */
      const canvas = document.getElementById("ambientCanvas");
      const context = canvas ? canvas.getContext("2d") : null;

      if (canvas && context && config.particlesEnabled && !reducedMotion) {
        let width = 0;
        let height = 0;
        let dpr = 1;
        let particles = [];
        let animationFrame = 0;
        let previousTime = 0;
        let elapsed = 0;

        const palette = [
          "rgba(184, 110, 124, 0.46)",
          "rgba(218, 159, 170, 0.42)",
          "rgba(205, 169, 137, 0.38)",
          "rgba(150, 106, 129, 0.28)"
        ];

        function createParticle(initial = false) {
          const roll = Math.random();
          const type = roll < 0.15 ? "heart" : roll < 0.32 ? "star" : "snow";
          return {
            type,
            x: random(8, Math.max(9, width - 8)),
            y: initial ? random(-height, height) : random(-70, -12),
            size: type === "heart" ? random(6, 13) : type === "star" ? random(5, 11) : random(1.4, 4.8),
            speed: type === "snow" ? random(12, 28) : random(7, 19),
            sway: random(4, 17),
            swaySpeed: random(0.18, 0.58),
            phase: random(0, Math.PI * 2),
            rotation: random(0, Math.PI * 2),
            rotationSpeed: random(-0.35, 0.35),
            alpha: random(0.46, 0.92),
            color: palette[Math.floor(Math.random() * palette.length)]
          };
        }

        function resizeCanvas() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          const count = width < 560 ? 26 : width < 1000 ? 40 : 54;
          particles = Array.from({ length: count }, () => createParticle(true));
        }

        function drawHeart(x, y, size, rotation, alpha, color) {
          const scale = size / 18;
          context.save();
          context.translate(x, y);
          context.rotate(rotation);
          context.scale(scale, scale);
          context.globalAlpha = alpha;
          context.fillStyle = color;
          context.beginPath();
          context.moveTo(0, 6.2);
          context.bezierCurveTo(-9.8, -1.4, -11.6, -11.3, -5.2, -13.6);
          context.bezierCurveTo(-1.7, -14.8, 0, -10.6, 0, -8.8);
          context.bezierCurveTo(0, -10.6, 1.7, -14.8, 5.2, -13.6);
          context.bezierCurveTo(11.6, -11.3, 9.8, -1.4, 0, 6.2);
          context.fill();
          context.restore();
        }

        function drawStar(x, y, size, rotation, alpha, color) {
          const scale = size / 16;
          context.save();
          context.translate(x, y);
          context.rotate(rotation);
          context.scale(scale, scale);
          context.globalAlpha = alpha;
          context.fillStyle = color;
          context.beginPath();
          context.moveTo(0, -8);
          context.quadraticCurveTo(1.1, -1.1, 8, 0);
          context.quadraticCurveTo(1.1, 1.1, 0, 8);
          context.quadraticCurveTo(-1.1, 1.1, -8, 0);
          context.quadraticCurveTo(-1.1, -1.1, 0, -8);
          context.fill();
          context.globalAlpha = alpha * 0.64;
          context.beginPath();
          context.arc(0, 0, 1.35, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        function animateParticles(time = 0) {
          if (!previousTime) previousTime = time;
          const delta = Math.min((time - previousTime) / 1000, 0.05);
          previousTime = time;
          elapsed += delta;

          context.clearRect(0, 0, width, height);

          particles.forEach((particle) => {
            particle.y += particle.speed * delta;
            particle.x += Math.sin(elapsed * particle.swaySpeed + particle.phase) * particle.sway * delta;
            particle.rotation += particle.rotationSpeed * delta;

            if (particle.y > height + 26) {
              Object.assign(particle, createParticle(false));
            }

            if (particle.x < -24) particle.x = width + 20;
            if (particle.x > width + 24) particle.x = -20;

            if (particle.type === "heart") {
              drawHeart(particle.x, particle.y, particle.size, particle.rotation, particle.alpha, particle.color);
            } else if (particle.type === "star") {
              drawStar(particle.x, particle.y, particle.size, particle.rotation, particle.alpha, particle.color);
            } else {
              context.save();
              context.translate(particle.x, particle.y);
              context.rotate(particle.rotation);
              context.globalAlpha = particle.alpha * 0.82;
              context.fillStyle = "rgba(255, 251, 244, 0.92)";
              context.strokeStyle = "rgba(255, 251, 244, 0.8)";
              context.lineWidth = 0.75;
              if (particle.size > 2.35) {
                const radius = particle.size * 1.7;
                for (let arm = 0; arm < 3; arm += 1) {
                  const angle = arm * Math.PI / 3;
                  context.beginPath();
                  context.moveTo(-Math.cos(angle) * radius, -Math.sin(angle) * radius);
                  context.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                  context.stroke();
                }
                context.globalAlpha = particle.alpha * 0.52;
                context.beginPath();
                context.arc(0, 0, 0.9, 0, Math.PI * 2);
                context.fill();
              } else {
                context.beginPath();
                context.arc(0, 0, particle.size, 0, Math.PI * 2);
                context.fill();
              }
              context.restore();
            }
          });

          animationFrame = window.requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        animationFrame = window.requestAnimationFrame(animateParticles);

        let resizeTimer = 0;
        window.addEventListener("resize", () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(resizeCanvas, 160);
        }, { passive: true });

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            window.cancelAnimationFrame(animationFrame);
          } else {
            previousTime = 0;
            animationFrame = window.requestAnimationFrame(animateParticles);
          }
        });
      } else if (canvas) {
        canvas.hidden = true;
      }

      /* ------------------------------
         阅读进度与滚动淡入
      ------------------------------ */
      const progressBar = document.getElementById("readingProgress");
      let progressTicking = false;

      function updateReadingProgress() {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const progress = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
        if (progressBar) progressBar.style.transform = `scaleX(${progress})`;
        const topbar = document.querySelector(".topbar");
        if (topbar) topbar.classList.toggle("is-reading", window.scrollY > window.innerHeight * 0.72);
        progressTicking = false;
      }

      window.addEventListener("scroll", () => {
        if (!progressTicking) {
          progressTicking = true;
          window.requestAnimationFrame(updateReadingProgress);
        }
      }, { passive: true });
      window.addEventListener("resize", updateReadingProgress, { passive: true });
      updateReadingProgress();

      const revealElements = [...document.querySelectorAll(".reveal")];
      if (!reducedMotion && "IntersectionObserver" in window) {
        document.documentElement.classList.add("has-reveal");
        const revealObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });

        revealElements.forEach((element) => revealObserver.observe(element));
      } else {
        revealElements.forEach((element) => element.classList.add("is-visible"));
      }
      /* ------------------------------
         接受 / 拒绝反馈
      ------------------------------ */
      const overlay = document.getElementById("responseOverlay");
      const responseTitle = document.getElementById("responseTitle");
      const responseMessage = document.getElementById("responseMessage");
      const responseKicker = document.getElementById("responseKicker");
      const responseClose = document.getElementById("responseClose");
      const burstLayer = document.getElementById("burstLayer");
      const acceptButton = document.getElementById("acceptButton");
      const rejectButton = document.getElementById("rejectButton");
      let previouslyFocused = null;
      let overlayCloseTimer = 0;

      function makeBurst(kind, originX, originY) {
        if (!burstLayer || reducedMotion) return;

        burstLayer.replaceChildren();
        const isReject = kind === "reject";
        const count = isReject ? 16 : 42;
        const colors = isReject
          ? ["#b97c88", "#cfa7ae", "#c9ad8d"]
          : ["#b35f70", "#cf8492", "#dda6b0", "#d8b083", "#a66d80"];

        for (let index = 0; index < count; index += 1) {
          const particle = document.createElement("span");
          const angle = Math.random() * Math.PI * 2;
          const distance = isReject ? 25 + Math.random() * 100 : 56 + Math.random() * 205;
          const dx = Math.cos(angle) * distance;
          const dy = Math.sin(angle) * distance + (isReject ? 50 : 18);

          particle.className = `burst-particle${isReject ? " is-reject" : ""}`;
          particle.textContent = Math.random() > (isReject ? 0.35 : 0.25) ? "♥" : "✦";
          particle.style.setProperty("--x", `${originX}px`);
          particle.style.setProperty("--y", `${originY}px`);
          particle.style.setProperty("--dx", `${dx}px`);
          particle.style.setProperty("--dy", `${dy}px`);
          particle.style.setProperty("--rotate", `${Math.round(random(-260, 260))}deg`);
          particle.style.setProperty("--scale", `${random(0.65, 1.35).toFixed(2)}`);
          particle.style.setProperty("--size", `${Math.round(random(9, isReject ? 16 : 19))}px`);
          particle.style.setProperty("--duration", `${isReject ? random(1.5, 2.15) : random(1.1, 1.7)}s`);
          particle.style.setProperty("--delay", `${random(0, 0.16).toFixed(2)}s`);
          particle.style.setProperty("--particle-color", colors[Math.floor(Math.random() * colors.length)]);
          burstLayer.appendChild(particle);
        }

        window.setTimeout(() => {
          burstLayer.replaceChildren();
        }, isReject ? 2400 : 2000);
      }

      function openResponse(kind, event) {
        const isAccept = kind === "accept";
        window.clearTimeout(overlayCloseTimer);
        previouslyFocused = document.activeElement;

        overlay.classList.toggle("is-reject", !isAccept);
        responseKicker.textContent = isAccept ? "A HAPPY BEGINNING" : "A GENTLE ANSWER";
        responseTitle.textContent = isAccept ? config.acceptTitle : config.rejectTitle;
        responseMessage.textContent = isAccept ? config.acceptMessage : config.rejectMessage;
        responseClose.textContent = isAccept ? config.acceptClose : config.rejectClose;

        overlay.hidden = false;
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("overlay-open");

        window.requestAnimationFrame(() => {
          overlay.classList.add("is-open");
        });

        const rect = event.currentTarget.getBoundingClientRect();
        makeBurst(kind, rect.left + rect.width / 2, rect.top + rect.height / 2);

        window.setTimeout(() => {
          responseClose.focus({ preventScroll: true });
        }, reducedMotion ? 0 : 180);
      }

      function closeResponse() {
        if (overlay.hidden) return;
        overlay.classList.remove("is-open");
        document.body.classList.remove("overlay-open");

        overlayCloseTimer = window.setTimeout(() => {
          overlay.hidden = true;
          overlay.setAttribute("aria-hidden", "true");
          if (previouslyFocused && typeof previouslyFocused.focus === "function") {
            previouslyFocused.focus({ preventScroll: true });
          }
        }, reducedMotion ? 0 : 430);
      }

      if (acceptButton) {
        acceptButton.addEventListener("click", (event) => openResponse("accept", event));
      }

      if (rejectButton) {
        rejectButton.addEventListener("click", (event) => openResponse("reject", event));
      }

      if (responseClose) {
        responseClose.addEventListener("click", closeResponse);
      }

      if (overlay) {
        overlay.addEventListener("click", (event) => {
          if (event.target.hasAttribute("data-close-response")) closeResponse();
        });

        overlay.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeResponse();
          }

          if (event.key === "Tab") {
            event.preventDefault();
            responseClose.focus({ preventScroll: true });
          }
        });
      }
      /* ------------------------------
         音乐播放
         浏览器通常会阻止无交互的自动播放：
         先尝试播放；若被拦截，第一次轻触页面时会自动重试。
         顶部配置区可关闭自动播放。
      ------------------------------ */
      const musicToggle = document.getElementById("musicToggle");
      const musicToast = document.getElementById("musicToast");
      const entryGate = document.getElementById("entryGate");
      const entryStart = document.getElementById("entryStart");
      const entryStage = document.querySelector(".envelope-stage");
      const entrySkip = document.getElementById("entrySkip");
      const audio = new Audio();
      const configuredMusic = typeof config.musicUrl === "string" && config.musicUrl.trim().length > 0;
      let isPlaying = false;
      let awaitingGesture = false;
      let toastTimer = 0;
      let firstGestureHandled = false;
      let entryGateOpen = false;
      let entryGateTimer = 0;

      audio.loop = true;
      audio.preload = "auto";
      audio.volume = 0.52;

      function showToast(message, duration = 3600) {
        if (!musicToast || !message) return;
        window.clearTimeout(toastTimer);
        musicToast.textContent = message;
        musicToast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => {
          musicToast.classList.remove("is-visible");
        }, duration);
      }

      function updateMusicUI(playing) {
        isPlaying = playing;
        if (playing && musicToast) {
          window.clearTimeout(toastTimer);
          musicToast.classList.remove("is-visible");
        }
        if (!musicToggle) return;
        musicToggle.classList.toggle("is-playing", playing);
        musicToggle.setAttribute("aria-pressed", String(playing));
        musicToggle.setAttribute("aria-label", playing ? "暂停背景音乐" : "播放背景音乐");
      }

      async function attemptPlay(fromGesture = false) {
        if (!configuredMusic) {
          updateMusicUI(false);
          if (fromGesture || firstGestureHandled) showToast(config.musicMissingHint);
          return false;
        }

        try {
          await audio.play();
          updateMusicUI(true);
          awaitingGesture = false;
          return true;
        } catch (error) {
          updateMusicUI(false);
          if (fromGesture) showToast(config.musicGestureHint);
          return false;
        }
      }

      async function toggleMusic() {
        firstGestureHandled = true;

        if (isPlaying) {
          audio.pause();
          updateMusicUI(false);
          return;
        }

        const played = await attemptPlay(true);
        if (!played && configuredMusic) {
          awaitingGesture = true;
        }
      }

      function showEntryGate() {
        if (!entryGate || entryGateOpen || firstGestureHandled) return;
        window.clearTimeout(entryGateTimer);
        entryGateOpen = true;
        entryGate.hidden = false;
        entryGate.setAttribute("aria-hidden", "false");
        document.body.classList.add("entry-open");

        window.requestAnimationFrame(() => {
          entryGate.classList.add("is-visible");
        });

        window.setTimeout(() => {
          if (entryStage) entryStage.focus({ preventScroll: true });
        }, reducedMotion ? 0 : 220);
      }

      function closeEntryGate() {
        if (!entryGate || !entryGateOpen) return;
        entryGateOpen = false;
        entryGate.classList.remove("is-visible");
        entryGate.classList.add("is-closing");
        document.body.classList.remove("entry-open");

        entryGateTimer = window.setTimeout(() => {
          entryGate.hidden = true;
          entryGate.setAttribute("aria-hidden", "true");
          entryGate.classList.remove("is-closing", "is-opening");
        }, reducedMotion ? 0 : 440);
      }

      function startEntryWithMusic() {
        if (!entryGateOpen || entryGate.classList.contains("is-opening")) return;
        firstGestureHandled = true;
        awaitingGesture = false;
        entryGate.classList.add("is-opening");

        let playback = Promise.resolve(false);
        if (config.autoPlay) {
          try {
            audio.currentTime = 0;
          } catch (error) {
            /* 音频尚未加载完成时，直接从开头播放即可。 */
          }
          playback = attemptPlay(true);
        }

        window.clearTimeout(entryGateTimer);
        entryGateTimer = window.setTimeout(closeEntryGate, reducedMotion ? 80 : 1500);
        playback.then((played) => {
          if (!played && configuredMusic && config.autoPlay) showToast(config.musicGestureHint, 4200);
        });
      }

      function skipEntryAndRead() {
        firstGestureHandled = true;
        awaitingGesture = false;
        closeEntryGate();
        if (musicToggle) {
          window.setTimeout(() => musicToggle.focus({ preventScroll: true }), reducedMotion ? 0 : 460);
        }
      }

      if (entryStart) {
        entryStart.setAttribute("aria-label", config.entryStart);
        entryStart.addEventListener("click", startEntryWithMusic);
      }
      if (entrySkip) entrySkip.addEventListener("click", skipEntryAndRead);

      /* 信封入口始终展示一次，让拆信动画成为阅读的开场。 */
      window.setTimeout(showEntryGate, 80);

      if (entryGate) {
        entryGate.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            skipEntryAndRead();
            return;
          }

          if (event.key === "Tab") {
            const focusable = [entryStart, entrySkip].filter(Boolean);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];

            if (event.shiftKey && (document.activeElement === first || document.activeElement === entryStage)) {
              event.preventDefault();
              last.focus({ preventScroll: true });
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus({ preventScroll: true });
            }
          }
        });
      }

      if (configuredMusic) {
        audio.src = config.musicUrl;
        audio.load();

        audio.addEventListener("playing", () => updateMusicUI(true));
        audio.addEventListener("pause", () => updateMusicUI(false));
        audio.addEventListener("error", () => {
          updateMusicUI(false);
          if (firstGestureHandled) showToast(config.musicMissingHint, 4400);
        });

        /* 信封入口会提供一次明确点击，音乐在拆信动画开始时同步播放。 */
      }

      if (musicToggle) {
        musicToggle.addEventListener("click", toggleMusic);
      }

      /* 自动播放失败后，在第一次真实的轻触或按键操作中重试。 */
      function retryMusicAfterGesture(event) {
        if (!config.autoPlay || !awaitingGesture || firstGestureHandled || !configuredMusic) return;
        if (event.target instanceof Element && event.target.closest("#musicToggle, #entryGate")) return;

        firstGestureHandled = true;
        attemptPlay(true);
      }

      document.addEventListener("pointerdown", retryMusicAfterGesture, { capture: true, passive: true });
      document.addEventListener("keydown", retryMusicAfterGesture, { capture: true });
    })();
  </script>
</body>
</html>
